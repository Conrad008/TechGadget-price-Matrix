<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechGadget | price matrix</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>

      <h1>TechGadget Price Matrix</h1>

      <section class="container">
        
        <article class="product">
          <img src="assets/images/laptop.jpg" alt="Laptop" class="img" />

          <h2>Gaming Laptop</h2>

          <p class="description">
            High performance laptop designed for gaming and multitasking.
          </p>

          <button type="submit">buy now</button>
        </article>

        <article class="product">
          <img src="assets/images/headphones.jpg" alt="Headphones" class="img" />

          <h2>Wireless Headphones</h2>

          <p class="description">
            Noise-cancelling headphones with premium sound quality.
          </p>

          <button type="submit">Buy Now</button>
        </article>

        <article class="product">
          <img src="assets/images/Phone.jpg" alt="Phone" class="img" />

          <h2>5G mobile smartphone</h2>

          <p class="description">
            5G mobile smartohine capable of calls messages and internet browsing
          </p>

          <button class="submit">Buy Now</button>
        </article>
      </section>
    </main>
  </body>
</html>
